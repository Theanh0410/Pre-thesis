<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Home Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>

  <body>
    {% include 'partials/navbar.html' %}

    <div class="container">
      <!-- Sensor Data -->
      <div class="grid">
        {% for room in rooms %}
        <div class="card" id="room-{{ room.id }}" data-room-id="{{ room.id }}" data-room-name="{{ room.name }}">
          <div class="card-title">
            <i class="fas fa-{{ room.icon }}"></i>
            {{ room.name }}
          </div>

          <div class="sensor-grid">
            <div class="sensor-card">
              <i class="fas fa-tint sensor-icon humidity-icon"></i>
              <div class="sensor-label">Humidity</div>
              <div class="sensor-value" id="room-{{ room.id }}-humidity">--%</div>
            </div>
            <div class="sensor-card">
              <i class="fas fa-sun sensor-icon light-icon"></i>
              <div class="sensor-label">Light</div>
              <div class="sensor-value" id="room-{{ room.id }}-light-sensor">--</div>
            </div>
          </div>

          <div class="device-grid" id="devices-{{ room.id }}" style="margin-top: 20px">
            {% for device in room.devices %}
            <button
              class="device-button {{ 'fan' if device.device_code == 'fan' else 'light' }}-{{ 'on' if device.status == 'on' else 'off' }}"
              id="device-{{ device.id }}"
              data-device-code="{{ device.device_code }}"
              data-command-base="{{ device.command_base }}"
              onclick="toggleDevice('device-{{ device.id }}')"
            >
              <i class="fas fa-{{ device.icon }}"></i>
              {{ device.custom_name }}
            </button>
            {% endfor %}

            <button class="add-device-tile" onclick="showAddDeviceForm({{ room.id }})">
              <i class="fas fa-plus"></i>
              Add Device
            </button>
          </div>

          <div class="inline-device-form" id="device-form-{{ room.id }}">
            <select id="device-type-{{ room.id }}" class="input">
              <option value="">Choose device</option>
              <option value="1" data-code="light" data-icon="lightbulb">Light</option>
              <option value="2" data-code="fan" data-icon="fan">Fan</option>
            </select>

            <input
              type="text"
              id="device-name-{{ room.id }}"
              class="input"
              placeholder="Custom device name"
            />

            <div class="inline-device-actions">
              <button class="small-add-button" onclick="addDeviceToRoom({{ room.id }})">
                Add
              </button>
              <button class="small-cancel-button" onclick="hideAddDeviceForm({{ room.id }})">
                Cancel
              </button>
            </div>
          </div>
        </div>
        {% endfor %}

        <!-- Add Room -->
        <div class="card add-room-card" id="addRoomCard">
          <div class="card-title">
            <i class="fas fa-plus-circle"></i>
            Add New Room
          </div>

          <div class="add-room-form">
            <input type="text" id="roomName" class="input add-room-input" placeholder="Enter room name"/>
            <button class="add-room-button" onclick="addRoom()">
              <i class="fas fa-plus"></i>
              Add Room
            </button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-microphone"></i>
          Voice command
        </div>

        <button class="btn" id="voiceBtn" onclick="startVoiceRecording()">
          <i class="fas fa-microphone"></i>
          Start recording
        </button>

        <div style="margin-top: 15px; display: flex; gap: 10px;">
          <input
            type="text"
            id="textCommandInput"
            class="input"
            placeholder="Or type your question here..."
            style="flex: 1; margin-bottom: 0;"
            onkeydown="if (event.key === 'Enter') sendTextCommand();"
          />
          <button class="btn" id="textCommandBtn" onclick="sendTextCommand()" style="width: auto;">
            <i class="fas fa-paper-plane"></i>
            Send
          </button>
        </div>

        <div style="margin-top: 15px">
          <div style="margin-bottom: 8px; color: #b8b8d4">Recorded text:</div>
          <div
            id="voiceText"
            style="
              background: #0f3460;
              border: 1px solid #2a2a3e;
              border-radius: 12px;
              padding: 14px;
              min-height: 52px;
            "
          >
            No data available...
          </div>
        </div>

        <div style="margin-top: 15px">
          <div style="margin-bottom: 8px; color: #b8b8d4">Response:</div>
          <div
            id="voiceResponse"
            style="
              background: #0f3460;
              border: 1px solid #2a2a3e;
              border-radius: 12px;
              padding: 14px;
              min-height: 52px;
              white-space: pre-wrap;
            "
          >
            No data available...
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script>
      // Device states, keyed by button id (e.g. "device-12"); populated as
      // devices are toggled, defaulting to false via toggleDevice()'s fallback.
      let deviceStates = {};

      // Initialize Socket.IO client
      var socket = io();

      // Connection status
      socket.on('connect', function () {
        updateConnectionStatus(true);
      });

      socket.on('disconnect', function () {
        updateConnectionStatus(false);
      });

      // Send command function
      async function sendCommand(command) {
        try {
          const response = await fetch('/control', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ command: command }),
          });
          const data = await response.json();
          console.log(data.message);
        } catch (error) {
          console.error('Error sending command:', error);
        }
      }

      // Toggle device function
      function toggleDevice(device) {
        const button = document.getElementById(device);

        const currentState = deviceStates[device] || false;
        const newState = !currentState;
        const action = newState ? 'on' : 'off';

        deviceStates[device] = newState;
        updateDeviceUI(device, newState);

        const commandBase = button.dataset.commandBase || device;
        sendCommand(`${commandBase}_${action}`);
      }

      // Update device UI
      function updateDeviceUI(device, isOn) {
        const button = document.getElementById(device);

        if (!button) return;

        const deviceCode = button.dataset.deviceCode || device;

        if (deviceCode.includes('light')) {
          button.className = `device-button ${isOn ? 'light-on' : 'light-off'}`;
        } else if (deviceCode.includes('fan')) {
          button.className = `device-button ${isOn ? 'fan-on' : 'fan-off'}`;
        } else {
          button.className = `device-button ${isOn ? 'light-on' : 'light-off'}`;
        }
      }

      // Handle sensor data - matches by room name against whichever rooms
      // actually exist for this user, instead of two hardcoded room ids.
      socket.on('sensor_data', function (data) {
        console.log('Received sensor data:', data);

        const roomCards = document.querySelectorAll('.grid .card[data-room-id]');
        roomCards.forEach(function (card) {
          if ((card.dataset.roomName || '').toLowerCase() !== (data.room || '').toLowerCase()) {
            return;
          }
          const humidityEl = document.getElementById(`room-${card.dataset.roomId}-humidity`);
          const lightEl = document.getElementById(`room-${card.dataset.roomId}-light-sensor`);
          if (humidityEl) humidityEl.innerText = data.humidity + '%';
          if (lightEl) lightEl.innerText = data.light_level;
        });
      });

      // Handle device status pushed from voice/MQTT commands - looks up the
      // button by its data-command-base instead of a hardcoded list, so it
      // works for any room/device, not just the original living room/bedroom.
      socket.on('device_status', function (data) {
        console.log('Received device status:', data);

        const match = (data.command || '').match(/^(.*)_(on|off)$/);
        if (!match) return;

        const [, commandBase, state] = match;
        const button = document.querySelector(`[data-command-base="${commandBase}"]`);
        if (!button) return;

        const isOn = state === 'on';
        deviceStates[button.id] = isOn;
        updateDeviceUI(button.id, isOn);
      });

      // Renders a /start_voice or /process_text result into the shared
      // "Recorded text" / "Response" boxes.
      function displayCommandResult(data) {
        const voiceText = document.getElementById('voiceText');
        const voiceResponse = document.getElementById('voiceResponse');

        if (data.status === 'success') {
          voiceText.innerText = data.text || 'No content received.';

          let responseText = data.response || 'No response received.';
          if (data.health_topic) {
            responseText = `[Health: ${data.health_topic}] ${responseText}`;
          }
          voiceResponse.innerText = responseText;
        } else {
          voiceText.innerText = data.message || 'An error occurred.';
          voiceResponse.innerText = 'No data available...';
        }
      }

      // Voice recording
      async function startVoiceRecording() {
        const btn = document.getElementById('voiceBtn');
        const voiceText = document.getElementById('voiceText');
        const voiceResponse = document.getElementById('voiceResponse');

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Recording...';
        voiceText.innerText = 'Preparing to record...';
        voiceResponse.innerText = 'No data available...';

        setTimeout(() => {
          voiceText.innerText = 'Recording... Say something into the microphone!';
        }, 2000);

        try {
          const response = await fetch('/start_voice', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
          });

          const data = await response.json();
          displayCommandResult(data);
        } catch (error) {
          console.error('Voice recording error:', error);
          voiceText.innerText = 'Cannot connect to voice server.';
          voiceResponse.innerText = 'No data available...';
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-microphone"></i> Start Recording';
        }
      }

      // Typed text command - useful when speech recognition misheard something
      async function sendTextCommand() {
        const input = document.getElementById('textCommandInput');
        const btn = document.getElementById('textCommandBtn');
        const voiceText = document.getElementById('voiceText');
        const voiceResponse = document.getElementById('voiceResponse');

        const text = input.value.trim();
        if (!text) return;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        voiceText.innerText = 'Processing...';
        voiceResponse.innerText = 'No data available...';

        try {
          const response = await fetch('/process_text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text }),
          });

          const data = await response.json();
          displayCommandResult(data);
          input.value = '';
        } catch (error) {
          console.error('Text command error:', error);
          voiceText.innerText = 'Cannot connect to voice server.';
          voiceResponse.innerText = 'No data available...';
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
        }
      }

      function addRoom() {
        const roomName = document.getElementById('roomName').value;

        fetch('/add_room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room_name: roomName })
        })
          .then(response => response.json())
          .then(data => {
            if (data.status === 'success') {
              alert('Room added!');
              // Optionally, update the UI to show the new room
              addRoomCard(data.room_id, data.room_name, data.devices);
            } else {
              alert(data.message);
            }
          })
          .catch(error => console.error('Error adding room:', error));
      }

      //add room
      // Mirrors room_icon() in app.py - keep in sync.
      function getRoomIcon(roomName) {
        const icons = {
          bed: 'bed', bath: 'bath', kitchen: 'kitchen-set',
          living: 'couch', garage: 'warehouse', office: 'briefcase',
        };
        const name = (roomName || '').toLowerCase();
        for (const keyword in icons) {
          if (name.includes(keyword)) return icons[keyword];
        }
        return 'house-chimney';
      }

      function addRoomCard(roomId, roomName, devices) {
        const roomCardHTML = `
          <div class="card" id="room-${roomId}" data-room-id="${roomId}" data-room-name="${roomName}">
            <div class="card-title">
              <i class="fas fa-${getRoomIcon(roomName)}"></i>
              ${roomName}
            </div>

            <div class="sensor-grid">
              <div class="sensor-card">
                <i class="fas fa-tint sensor-icon humidity-icon"></i>
                <div class="sensor-label">Humidity</div>
                <div class="sensor-value" id="room-${roomId}-humidity">--%</div>
              </div>

              <div class="sensor-card">
                <i class="fas fa-sun sensor-icon light-icon"></i>
                <div class="sensor-label">Light</div>
                <div class="sensor-value" id="room-${roomId}-light-sensor">--</div>
              </div>
            </div>

            <div class="device-grid" id="devices-${roomId}" style="margin-top: 20px">
              ${devices.map(device => `
                <button
                  class="device-button ${device.status === 'on' ? 'light-on' : 'light-off'}"
                  id="device-${device.id}"
                  data-device-code="${device.device_code || 'light'}"
                  data-command-base="device-${device.id}"
                  onclick="toggleDevice('device-${device.id}')"
                >
                  <i class="fas fa-lightbulb"></i>
                  ${device.custom_name || 'Device'}
                </button>
              `).join('')}

              <button class="add-device-tile" onclick="showAddDeviceForm(${roomId})">
                <i class="fas fa-plus"></i>
                Add Device
              </button>
            </div>

            <div class="inline-device-form" id="device-form-${roomId}">
              <select id="device-type-${roomId}" class="input">
                <option value="">Choose device</option>
                <option value="1" data-code="light" data-icon="lightbulb">Light</option>
                <option value="2" data-code="fan" data-icon="fan">Fan</option>
              </select>

              <input
                type="text"
                id="device-name-${roomId}"
                class="input"
                placeholder="Custom device name"
              />

              <div class="inline-device-actions">
                <button class="small-add-button" onclick="addDeviceToRoom(${roomId})">
                  Add
                </button>

                <button class="small-cancel-button" onclick="hideAddDeviceForm(${roomId})">
                  Cancel
                </button>
              </div>
            </div>
          </div>
        `;

        // Insert the new room card before the "Add Room" tile, so it stays last
        const addRoomCard = document.getElementById('addRoomCard');
        addRoomCard.insertAdjacentHTML('beforebegin', roomCardHTML);
      }

      function addDevice() {
        const roomId = document.getElementById('roomSelect').value;
        const deviceTypeId = document.getElementById('deviceTypeSelect').value;
        const customName = document.getElementById('deviceName').value;

        fetch('/add_device', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room_id: roomId, device_type_id: deviceTypeId, custom_name: customName })
        })
          .then(response => response.json())
          .then(data => {
            if (data.status === 'success') {
              alert('Device added!');
              // Optionally, update the UI to show the new device
            } else {
              alert(data.message);
            }
          })
          .catch(error => console.error('Error adding device:', error));
      }

      function showAddDeviceForm(roomId) {
        const form = document.getElementById(`device-form-${roomId}`);
        form.style.display = 'block';
      }

      function hideAddDeviceForm(roomId) {
        const form = document.getElementById(`device-form-${roomId}`);
        form.style.display = 'none';
      }

      function normalizeRoomName(roomName) {
        return roomName.toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
      }

      async function addDeviceToRoom(roomId) {
        const deviceTypeSelect = document.getElementById(`device-type-${roomId}`);
        const deviceNameInput = document.getElementById(`device-name-${roomId}`);

        const deviceTypeId = deviceTypeSelect.value;
        const customName = deviceNameInput.value.trim();

        if (!deviceTypeId) {
          alert('Please choose a device type.');
          return;
        }

        if (!customName) {
          alert('Please enter a device name.');
          return;
        }

        try {
          const response = await fetch('/add_device', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              room_id: roomId,
              device_type_id: deviceTypeId,
              custom_name: customName
            })
          });

          const data = await response.json();

          if (data.status === 'success') {
            const selectedOption = deviceTypeSelect.options[deviceTypeSelect.selectedIndex];

            const device = {
              id: data.device_id,
              custom_name: customName,
              device_code: selectedOption.dataset.code,
              device_icon: selectedOption.dataset.icon,
              status: 'off'
            };

            addDeviceButtonToRoom(roomId, device);

            deviceTypeSelect.value = '';
            deviceNameInput.value = '';
            hideAddDeviceForm(roomId);
          } else {
            alert(data.message);
          }
        } catch (error) {
          console.error('Error adding device:', error);
        }
      }

      function addDeviceButtonToRoom(roomId, device) {
        const roomCard = document.getElementById(`room-${roomId}`);
        const roomName = roomCard.dataset.roomName;
        const roomCode = normalizeRoomName(roomName);

        const deviceId = `device-${device.id}`;
        const commandBase = `${roomCode}_${device.device_code}`;

        deviceStates[deviceId] = false;

        const buttonHTML = `
          <button
            class="device-button ${device.device_code === 'fan' ? 'fan-off' : 'light-off'}"
            id="${deviceId}"
            data-device-code="${device.device_code}"
            data-command-base="${commandBase}"
            onclick="toggleDevice('${deviceId}')"
          >
            <i class="fas fa-${device.device_icon}"></i>
            ${device.custom_name}
          </button>
        `;

        const deviceGrid = document.getElementById(`devices-${roomId}`);
        const addButton = deviceGrid.querySelector('.add-device-tile');

        addButton.insertAdjacentHTML('beforebegin', buttonHTML);
      }
    </script>
  </body>
</html>
